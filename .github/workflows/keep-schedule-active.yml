name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record repository activity
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .uptime-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .uptime-heartbeat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: keep uptime schedule active"
          git push
