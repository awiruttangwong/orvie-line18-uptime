name: Keep LINE 18 Awake

on:
  schedule:
    # Bangkok business window: wake before 06:00, then keep inbound gaps < 15 minutes.
    # UTC 22:43/22:53 = Bangkok 05:43/05:53.
    - cron: "43,53 22 * * *"
    # UTC 23:03 through 18:53 = Bangkok 06:03 through 01:53.
    - cron: "3,13,23,33,43,53 0-18,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line18-render-uptime
  cancel-in-progress: true

jobs:
  wake-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render and verify health
        shell: bash
        run: |
          set -u
          URL="https://orvie-line18-render.onrender.com/health"
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            if curl -fsS --connect-timeout 15 --max-time 100 "$URL" -o /tmp/line18-health.json; then
              if python -c 'import json; from pathlib import Path; h=json.loads(Path("/tmp/line18-health.json").read_text()); assert h.get("status")=="ok", h; assert h.get("owner_report",{}).get("background_alive") is True, h; assert h.get("owner_report_notifier",{}).get("background_alive") is True, h; print("LINE 18 reachable; report + notifier workers alive")'; then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "LINE 18 failed all external wake/health attempts" >&2
          exit 1
