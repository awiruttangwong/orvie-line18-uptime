name: Keep LINE 18 Awake

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub schedule congestion.
    # Six inbound requests/hour keeps the Render Free service below its 15-minute idle limit.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line18-render-uptime
  cancel-in-progress: true

jobs:
  wake-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render and verify health
        shell: bash
        run: |
          set -u
          URL="https://orvie-line18-render.onrender.com/health"
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            if curl -fsS --connect-timeout 15 --max-time 100 "$URL" -o /tmp/line18-health.json; then
              if python - <<'PY'
import json
from pathlib import Path

health = json.loads(Path("/tmp/line18-health.json").read_text())
assert health.get("status") == "ok", health
assert health.get("owner_report", {}).get("background_alive") is True, health
assert health.get("owner_report_notifier", {}).get("background_alive") is True, health
print("LINE 18 reachable; report + notifier workers alive")
PY
              then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "LINE 18 failed all external wake/health attempts" >&2
          exit 1
