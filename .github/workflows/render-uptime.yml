name: Keep LINE 18 Awake

on:
  schedule:
    # Bangkok business window: wake before 06:00, then keep inbound gaps < 15 minutes.
    # UTC 22:43/22:53 = Bangkok 05:43/05:53.
    - cron: "43,53 22 * * *"
    # UTC 23:03 through 18:53 = Bangkok 06:03 through 01:53.
    - cron: "3,13,23,33,43,53 0-18,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line18-render-uptime
  cancel-in-progress: false

jobs:
  wake-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Sustain checks between delayed scheduled runs
        run: python keep_awake.py --cycles 33 --interval 600
